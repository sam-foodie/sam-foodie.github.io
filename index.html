<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的美食口袋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 私人、溫暖、好用的美食筆記本，像隨身的集點小冊
   IDEA: 晴天藍的筆記本封面＋手寫評分卡
   PICTURE: 收藏清單本身與台灣地圖上的圖釘
   COLOUR and TYPE: 天空藍 #6ab1d4 招牌、深海藍按鈕、淺水藍底，星星芥末黃；Noto Sans TC 900 標題
   LAYOUT: 手機優先，上方天空藍招牌帶、篩選列、卡片清單／地圖，右下新增鈕 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d1a20);--ink:light-dark(#16313d,#e6f2f7);--mute:light-dark(#5b7682,#8fa9b4);--head:light-dark(#6ab1d4,#1f5873);--htext:light-dark(#0e2f40,#eaf6fc);--deep:light-dark(#1f6f96,#7cc3e3);--ondeep:light-dark(#fff,#0d1a20);
--red:var(--head);--redd:var(--deep);--gold:#f2b705;--line:light-dark(#dcebf2,#203540);
--card:light-dark(#f3f9fc,#14262e);--chip:light-dark(#e8f3f9,#1b313b);--sea:light-dark(#dff0f8,#10222a);--land:light-dark(#fff,#1d3440);--coast:light-dark(#8fbfd6,#3f6a7e);--lbl:light-dark(#8eaebb,#5f8596)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{background:var(--head);color:var(--htext);padding:calc(env(safe-area-inset-top) + 18px) max(5vw,16px) 16px}
.top h1{margin:0;font-size:clamp(30px,7vw,42px);font-weight:900;line-height:1.05;letter-spacing:.02em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .row{justify-content:space-between}
.stat{font-size:15px;opacity:.95;margin-top:6px}
.stat b{font-size:20px}
.ib{border:2px solid var(--htext);background:transparent;color:var(--htext);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.search{margin-top:14px;width:100%;height:48px;border-radius:14px;border:0;padding:0 16px;font-size:16px;background:#fff;color:#16313d}
.seg{display:flex;background:rgba(14,47,64,.14);border-radius:14px;padding:4px;margin-top:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--htext);font-weight:700}
.seg button[aria-pressed=true]{background:#fff;color:#1f6f96}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(5vw,16px);display:grid;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:15px}
.chip[aria-pressed=true]{background:var(--htext);color:var(--head);border-color:var(--htext)}
.sel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.sel2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto}
.ck{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;font-size:15px;white-space:nowrap}.ck input{width:22px;height:22px;accent-color:var(--deep)}.ck:has(input:disabled){opacity:.5}
select:disabled{opacity:.5}
select,input[type=text],input[type=date],textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}
main{padding:14px max(5vw,16px) calc(110px + env(safe-area-inset-bottom));max-width:1240px;margin:0 auto}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{border:0;text-align:start;background:var(--card);border-radius:18px;padding:16px;display:grid;gap:6px;width:100%}
.card h3{margin:0;font-size:19px;line-height:1.3}
.meta{color:var(--mute);font-size:14px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.b-want{background:light-dark(#dff0f8,#1b3b4a);color:light-dark(#1f5a78,#a8d8ee)}
.rv{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}.rvh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.frl{font-size:14px}.frl .con,.frl .pro{color:var(--mute)}
.b-friend{background:var(--gold);color:#3a2a00}
.b-been{background:var(--deep);color:var(--ondeep)}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.pc{font-size:14px;display:grid;gap:2px}.pc span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pro::before{content:"＋ ";color:#2f8f5b;font-weight:900}.con::before{content:"－ ";color:#b0574f;font-weight:900}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty svg{width:120px;height:120px}
.empty h2{color:var(--ink);font-size:22px;margin:12px 0 6px}
.btn{min-height:48px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:16px;background:var(--deep);color:var(--ondeep);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.dark{background:var(--htext);color:var(--head)}
.fab{position:fixed;right:max(5vw,16px);bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;height:60px;padding:0 22px;border-radius:30px;font-size:18px;box-shadow:0 8px 24px rgba(31,111,150,.35)}
.mapwrap{position:relative;background:var(--sea);border-radius:20px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:min(68vh,640px);touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);color:var(--ink);font-size:22px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.mapnote{font-size:14px;color:var(--mute);margin:8px 2px}
.pop{position:absolute;left:12px;right:12px;bottom:12px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,8,7,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px max(5vw,18px) calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;font-size:24px;line-height:1.2}
.f{display:grid;gap:6px;margin-bottom:14px}
.f>label,.lab{font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.starpick{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.sc{font-size:17px}
.starpick button{width:100%;height:46px;padding:0;border:0;background:var(--chip);border-radius:9px;font-size:20px;color:light-dark(#c9d6dc,#3a4f5a)}
.starpick button.on{color:var(--gold)}
.mini{height:220px;border-radius:14px;overflow:hidden;background:var(--sea)}
.mini svg{width:100%;height:100%;display:block}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.acts>*{flex:1 1 140px}
.dl{display:grid;gap:12px;margin:10px 0}
.dl div{background:var(--card);border-radius:14px;padding:12px 14px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:none;gap:12px;align-items:center;max-width:92vw}
.toast.on{display:flex}.toast button{background:none;border:0;color:var(--gold);font-weight:700;min-height:36px}
.sync{font-size:12px;opacity:.85;margin-top:4px}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div><h1>我的美食口袋</h1><div class="stat" id="stat"></div><div class="sync" id="sync">連線中…</div></div>
    <button class="ib" id="toolsBtn">匯入／備份</button>
  </div>
  <input class="search" id="q" type="search" placeholder="搜尋店名、備註、優缺點" aria-label="搜尋">
  <div class="seg" role="group" aria-label="檢視方式"><button id="vList" aria-pressed="true">清單</button><button id="vMap" aria-pressed="false">地圖</button></div>
</header>
<div class="bar">
  <div class="chips" id="stChips"></div>
  <div class="sel">
    <select id="fArea" aria-label="區域"></select>
    <select id="fType" aria-label="類型"></select>
    <select id="fSort" aria-label="排序"><option value="new">最新加入</option><option value="rate">評分高到低</option><option value="name">店名</option></select>
  </div>
  <div class="sel sel2">
    <select id="fOp" aria-label="評分條件"><option value="">評分不限</option><option value="ge">評分 ≥</option><option value="gt">評分 ＞</option><option value="eq">評分 ＝</option><option value="le">評分 ≤</option><option value="lt">評分 ＜</option></select>
    <select id="fScore" aria-label="分數" disabled><option value="10">10 分</option><option value="9">9 分</option><option value="8" selected>8 分</option><option value="7">7 分</option><option value="6">6 分</option><option value="5">5 分</option><option value="4">4 分</option><option value="3">3 分</option><option value="2">2 分</option><option value="1">1 分</option></select>
    <label class="ck"><input type="checkbox" id="fMine"> 只看我的</label>
  </div>
</div>
<main id="main"></main>
<button class="btn fab" id="addBtn">＋ 新增</button>
<div class="overlay" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>
<input type="file" id="fileIn" accept=".json,.csv,application/json,text/csv" hidden>

<script>
{
const COUNTIES=[["基隆市",25.13,121.74,"北部"],["臺北市",25.05,121.55,"北部"],["新北市",25.01,121.46,"北部"],["桃園市",24.99,121.30,"北部"],["新竹市",24.80,120.97,"北部"],["新竹縣",24.75,121.10,"北部"],["宜蘭縣",24.70,121.75,"北部"],["苗栗縣",24.50,120.85,"中部"],["臺中市",24.15,120.68,"中部"],["彰化縣",24.05,120.52,"中部"],["南投縣",23.90,120.85,"中部"],["雲林縣",23.70,120.43,"中部"],["嘉義市",23.48,120.45,"南部"],["嘉義縣",23.45,120.30,"南部"],["臺南市",23.00,120.21,"南部"],["高雄市",22.63,120.30,"南部"],["屏東縣",22.55,120.55,"南部"],["花蓮縣",23.98,121.60,"東部"],["臺東縣",22.76,121.14,"東部"],["澎湖縣",23.57,119.58,"離島"],["金門縣",24.44,118.32,"離島"],["連江縣",26.16,119.95,"離島"]];
const AREAS=["北部","中部","南部","東部","離島"];
const TYPES=["小吃","牛肉麵","拉麵","日式","韓式","火鍋","燒肉","熱炒","早午餐","咖啡廳","甜點","麵包","西式","南洋","中式餐館","素食","酒吧","其他"];
const COAST=[[121.54,25.30],[121.75,25.15],[122.00,25.01],[121.85,24.85],[121.86,24.60],[121.70,24.30],[121.62,23.98],[121.50,23.50],[121.38,23.10],[121.15,22.75],[120.98,22.45],[120.90,22.25],[120.85,21.90],[120.73,21.95],[120.70,22.10],[120.60,22.37],[120.45,22.47],[120.27,22.62],[120.18,22.90],[120.10,23.05],[120.08,23.30],[120.14,23.38],[120.15,23.60],[120.20,23.80],[120.32,24.05],[120.50,24.25],[120.62,24.50],[120.80,24.70],[120.92,24.85],[121.03,25.02],[121.18,25.10],[121.40,25.18]];
const VIEWS={"全台":"-6 0 228 405","北部":"80 5 135 115","中部":"20 90 130 140","南部":"0 205 112 195","東部":"88 68 120 272"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=(lng,lat)=>[(lng-119.95)*100,(25.45-lat)*110];
const unP=(x,y)=>[x/100+119.95,25.45-y/110];
const areaOf=c=>(COUNTIES.find(k=>k[0]===c)||[])[3]||"國外";
const nearest=(lat,lng)=>{let b=null,d=1e9;for(const k of COUNTIES){const e=(k[1]-lat)**2+(k[2]-lng)**2;if(e<d){d=e;b=k[0]}}return d<0.6?b:""};
const stars=n=>{n=Math.max(0,Math.min(10,Math.round(+n||0)));return n?"★".repeat(n)+"☆".repeat(10-n):""};
const VERSION="2026-11-23d";
const hashS=t=>{let h=5381;for(const ch of String(t))h=((h*33)^ch.codePointAt(0))>>>0;return h.toString(36)};
const ME_K="foodpocket.me";
const getMe=()=>{try{return localStorage.getItem(ME_K)||""}catch(e){return ""}};
const setMe=v=>{try{localStorage.setItem(ME_K,v)}catch(e){}};
const score=n=>`<span class="stars" aria-label="${n} 分，滿分 10">${stars(n)}</span> <b class="sc">${n}</b><span class="meta">/10</span>`;
const norm=it=>{if(it.rating&&!it.r10){it.rating=Math.min(10,it.rating*2)}it.r10=true;return it};
const TWC=COUNTIES.map(k=>k[0]);
const fixC=c=>{c=String(c||"").replace(/^台/,"臺");return TWC.includes(c)?c:""};
const newId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const coastPath="M"+COAST.map(p=>P(...p).map(v=>v.toFixed(1)).join(",")).join("L")+"Z";

let items=[],col=null,view="list",fStatus="all",fWho="",selPin=null,lastDeleted=null,toastT=null;
const LS="foodpocket.v1";
const loadLocal=()=>{try{return JSON.parse(localStorage.getItem(LS)||"[]").map(norm)}catch(e){return []}};
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}};

async function put(it){
  const i=items.findIndex(x=>x.id===it.id);if(i>=0)items[i]=it;else items.push(it);
  render();
  if(col){try{await col.doc(it.id).set(JSON.parse(JSON.stringify(it)))}catch(e){toast("儲存失敗："+(e.code||"請稍後再試"))}}else saveLocal();
}
async function del(id){
  items=items.filter(x=>x.id!==id);render();
  if(col){try{await col.doc(id).delete()}catch(e){toast("刪除失敗")}}else saveLocal();
}

async function connect(){
  items=loadLocal();render();
  const c=window.claude;let db=null,user=null,uid=null;
  try{if(c&&c.use){db=await c.use("db");user=await c.use("user");uid=user?await user.id():null}}catch(e){}
  if(!db||!uid){$("sync").textContent="資料存在這台裝置的瀏覽器裡，記得定期備份";return}
  col=db.collection("data/users/"+uid);
  let first=true;const timer=setTimeout(()=>{$("sync").textContent="雲端暫時連不上，顯示的可能不是最新資料"},10000);
  col.onSnapshot(s=>{
    const remote=s.docs.map(d=>norm({...d.data(),id:d.id}));
    if(!s.metadata.fromCache){clearTimeout(timer);$("sync").textContent="已安全儲存在你的私人空間";
      if(first){first=false;const local=loadLocal();if(remote.length===0&&local.length){importItems({owner:"",items:local},true);return}}}
    items=remote;render();
  },e=>{clearTimeout(timer);col=null;$("sync").textContent="雲端無法使用，改存在這台裝置";items=loadLocal();render()});
}

const tw=t=>String(t||"").replace(/臺/g,"台").toLowerCase();
const nk=t=>tw(t).replace(/[\s·・()（）]/g,"");
const same=(a,b)=>nk(a.name)===nk(b.name)&&(!a.county||!b.county||a.county===b.county);
/* 同一家店只顯示一筆：我的那筆為主，朋友的評價掛在下面 */
function groups(){
  const G=items.filter(i=>!i.owner).map(m=>({id:m.id,p:m,mine:m,fr:[]}));
  for(const f of items.filter(i=>i.owner)){let g=G.find(g=>same(g.p,f));if(!g){g={id:f.id,p:f,mine:null,fr:[]};G.push(g)}g.fr.push(f)}
  return G;
}
const gRate=g=>(g.mine&&g.mine.status==="been"&&g.mine.rating)||Math.max(0,...g.fr.filter(f=>f.status==="been").map(f=>f.rating||0));
function filtered(){
  const op=$("fOp").value,sc=+$("fScore").value,q=tw($("q").value.trim()),a=$("fArea").value,t=$("fType").value,s=$("fSort").value;
  let r=groups().filter(g=>{const it=g.p;
    return (fStatus==="all"||(fStatus==="friend"?!g.mine:g.mine&&g.mine.status===fStatus))
    &&(!fWho||(fWho==="@me"?g.mine:g.fr.some(f=>f.owner===fWho)))
    &&(!a||(a.startsWith("@")?it.county===a.slice(1):(it.country&&it.country!=="台灣"?a==="國外":areaOf(it.county)===a)))
    &&(!t||it.type===t)
    &&(!$("fMine").checked||g.mine)
    &&(!op||($("fMine").checked?[g.mine]:[g.mine,...g.fr]).filter(x=>x&&x.status==="been"&&x.rating).some(x=>{const v=x.rating;return op==="ge"?v>=sc:op==="gt"?v>sc:op==="eq"?v===sc:op==="le"?v<=sc:v<sc}))
    &&(!q||[g.mine,...g.fr].filter(Boolean).map(x=>[x.name,x.district,x.county,x.address,x.pros,x.cons,x.note,x.type,x.owner].join(" ")).map(tw).join(" ").includes(q))});
  const tm=g=>Math.max(...[g.mine,...g.fr].filter(Boolean).map(x=>x.created||0));
  r.sort(s==="rate"?(x,y)=>gRate(y)-gRate(x):s==="name"?(x,y)=>x.p.name.localeCompare(y.p.name,"zh-Hant"):(x,y)=>tm(y)-tm(x));
  return r;
}
function where(it){return it.country&&it.country!=="台灣"?[it.country,it.county,it.district].filter(Boolean).join(" · "):[it.county,it.district].filter(Boolean).join(" · ")||"未設定地區"}

function fillFilters(){
  const a=$("fArea").value,t=$("fType").value;
  const used=[...new Set(items.map(i=>i.county).filter(Boolean))];
  $("fArea").innerHTML=`<option value="">全部地區</option>`+AREAS.map(x=>`<option value="${x}">${x}</option>`).join("")+(items.some(i=>i.country&&i.country!=="台灣")?`<option value="國外">國外</option>`:"")
   +`<optgroup label="縣市">`+COUNTIES.filter(k=>used.includes(k[0])).map(k=>`<option value="@${k[0]}">${k[0]}</option>`).join("")+`</optgroup>`;
  const ts=[...new Set([...TYPES.filter(x=>items.some(i=>i.type===x)),...items.map(i=>i.type).filter(Boolean)])];
  $("fType").innerHTML=`<option value="">全部類型</option>`+ts.map(x=>`<option>${esc(x)}</option>`).join("");
  $("fArea").value=a;$("fType").value=t;
}
function render(){
  const mine=items.filter(i=>!i.owner),w=mine.filter(i=>i.status==="want").length,b=mine.length-w;
  const friends=[...new Set(items.map(i=>i.owner).filter(Boolean))];if(fWho&&fWho!=="@me"&&!friends.includes(fWho))fWho="";
  if(fStatus==="friend"&&!friends.length)fStatus="all";
  $("stat").innerHTML=`想去 <b>${w}</b>　·　去過 <b>${b}</b>${friends.length?`　·　朋友 <b>${friends.length}</b>`:""}`;
  $("stChips").innerHTML=[["all","全部"],["want","想去"],["been","去過"],...(friends.length?[["friend","朋友推薦"]]:[])].map(([k,l])=>`<button class="chip" data-st="${k}" aria-pressed="${fStatus===k}">${l}</button>`).join("")

    const h=$("linkHint");if(h)h.insertAdjacentHTML("beforeend",` <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}" target="_blank" rel="noopener">在 Google 地圖查</a>`);return}
  if(SHORT.test(raw))hint("短網址展開失敗，請稍後再試；或在電腦瀏覽器打開後複製網址列的長網址。");
  else hint(found.length?"已帶入"+found.join("、")+" ✓":"沒讀到地點資訊，連結仍會存下來。");
}
function setPos(lat,lng){
  draft.lat=lat;draft.lng=lng;const tw=draft.country==="台灣";
  if(tw){const c=nearest(lat,lng);const sel=$("iCounty");if(c&&sel&&!sel.value)sel.value=c;
    if($("mini")){$("mini").innerHTML=mapSVG([],VIEWS["全台"],{id:"miniSvg",mark:[lat,lng]});$("posHint").textContent=`已設定座標 ${lat.toFixed(4)}, ${lng.toFixed(4)}`}}
}
function collect(){
  const d=draft;d.name=$("iName").value.trim();d.country=$("iCountry").value.trim()||"台灣";d.county=$("iCounty").value.trim();d.district=$("iDist").value.trim();d.address=$("iAddr").value.trim();
  d.price=+$("iPrice").value;d.note=$("iNote").value.trim();const ct=$("iType").value.trim();if(ct)d.type=ct;
  if($("iPros")){d.pros=$("iPros").value.trim();d.cons=$("iCons").value.trim()}
  d.updated=Date.now();return d;
}

/* ---------- 詳細 ---------- */
function openDetail(id){
  const g=groups().find(g=>g.id===id||(g.mine&&g.mine.id===id)||g.fr.some(f=>f.id===id));if(!g)return;
  const it=g.p,m=g.mine;
  const dest=it.lat!=null?`${it.lat},${it.lng}`:it.address?it.address:[it.name,it.district,it.county,it.country!=="台灣"?it.country:""].filter(Boolean).join(" ");
  const src=[m,...g.fr].find(x=>x&&x.url&&/^https?:\/\//.test(x.url));
  const open=src?src.url:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.lat!=null?it.name+" "+dest:dest)}`;
  const addr=[m,...g.fr].map(x=>x&&x.address).find(Boolean);
  const rev=x=>`${x.pros?`<div><b class="pro">優點</b>\n${esc(x.pros)}</div>`:""}${x.cons?`<div><b class="con">缺點</b>\n${esc(x.cons)}</div>`:""}${x.note?`<div><b>備註</b>\n${esc(x.note)}</div>`:""}`;
  $("sheet").innerHTML=`<div class="row" style="justify-content:space-between">${stBadge(g)}<span class="meta">${esc(it.type||"")}${it.price?" · "+"$".repeat(it.price):""}</span></div>
  <h2 style="margin-top:10px">${esc(it.name)}</h2><div class="meta">${esc(where(it))}</div>${addr?`<div class="meta">${esc(addr)}</div>`:""}
  <div class="acts"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}" target="_blank" rel="noopener">導航過去</a><a class="btn dark" href="${esc(open)}" target="_blank" rel="noopener">在 Google 地圖開啟</a></div>
  <div class="rv"><div class="rvh"><b>我的評價</b>${m?`<span class="meta">${m.status==="been"?"去過":"想去，還沒去"}</span>`:`<span class="meta">還沒去過</span>`}</div>
  ${m?`${m.status==="been"&&m.rating?`<div style="font-size:19px">${score(m.rating)}</div>`:""}<div class="dl">${rev(m)}</div>
  <div class="acts">${m.status==="want"?`<button class="btn ghost" data-act="markbeen" data-id="${esc(m.id)}">我去過了，寫評價</button>`:""}<button class="btn ghost" data-act="edit" data-id="${esc(m.id)}">編輯</button><button class="btn ghost" data-act="del" data-id="${esc(m.id)}">刪除</button></div>`
  :`<div class="acts"><button class="btn" data-act="adopt" data-id="${esc(g.fr[0].id)}">加到我的口袋（想去）</button></div>`}</div>
  ${g.fr.map(f=>`<div class="rv"><div class="rvh"><span><span class="badge b-friend">${esc(f.owner)}</span> 的評價</span><span class="meta">${f.status==="been"?"去過":"想去"}</span></div>
  ${f.status==="been"&&f.rating?`<div style="font-size:19px">${score(f.rating)}</div>`:""}<div class="dl">${rev(f)}</div>
  <button class="btn ghost" style="min-height:40px;font-size:14px" data-act="del" data-id="${esc(f.id)}">移除 ${esc(f.owner)} 的這筆</button></div>`).join("")}
  <div class="acts"><button class="btn ghost" data-act="close">關閉</button></div>`;
  $("ov").classList.add("on");
}

/* ---------- 匯入／備份 ---------- */
let dl=null;
function openTools(){
  $("sheet").innerHTML=`<h2>匯入與備份</h2>
  <div class="f"><label for="iMe">我的名字</label><input type="text" id="iMe" value="${esc(getMe())}" placeholder="例如 Sam" maxlength="20"><span class="hint">會寫進備份檔和檔名。朋友匯入你的檔案時，你的店會標上這個名字，跟他自己的分開。</span></div>
  <div class="f"><span class="lab">匯入備份或朋友的檔案</span><span class="hint">不會刪掉任何資料：新的店直接新增；兩邊都有的店，保留最後修改較新的那筆；檔案裡沒有的店照樣保留。檔案名字跟你一樣就當成你自己的，不一樣就當成朋友的推薦。</span><button class="btn" data-act="pick">選擇檔案匯入</button></div>
  <div class="f"><span class="lab">從 Google 地圖匯入已儲存的地點</span><span class="hint">1. 到 takeout.google.com，只勾「地圖（你的地點）」和「已儲存」，匯出。<br>2. 解壓縮後，選擇「已儲存的地點.json」（Saved Places.json），或「已儲存」資料夾裡任一清單的 .csv（如「想去的地點.csv」）。<br>匯入的店會先標成「想去」，重複的店名會略過。</span><button class="btn" data-act="pick">選擇檔案匯入</button></div>
  <div class="f"><span class="lab">備份</span><span class="hint">把所有收藏存成一個檔案，換裝置、傳給朋友或想保險時用。這台裝置目前共 ${items.length} 筆。</span><div class="acts">${dl||!window.claude?`<button class="btn dark" data-act="export">下載備份檔</button>`:""}<button class="btn ghost" data-act="copy">複製備份內容</button></div></div>
  <div class="f"><span class="lab">檢查更新</span><span class="hint">目前版本 ${VERSION}。剛上傳新版但畫面沒變時按這裡。</span><button class="btn ghost" data-act="reload">重新載入最新版</button></div>
  <div class="f"><span class="lab">加到 iPhone 主畫面</span><span class="hint">用 Safari 打開這個頁面 → 點下方分享鈕 → 「加入主畫面」，之後就像 App 一樣一點就開。</span></div>
  <div class="acts"><button class="btn ghost" data-act="close">關閉</button></div>`;
  $("ov").classList.add("on");
}
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function fromText(name,text){
  const out=[];
  if(/\.csv$/i.test(name)){const rows=parseCSV(text.replace(/^﻿/,""));const h=rows.shift().map(x=>x.trim().toLowerCase());
    const ix=k=>h.findIndex(x=>k.includes(x));const ti=ix(["title","標題","名稱"]),ni=ix(["note","附註","備註"]),ui=ix(["url","網址"]);
    for(const r of rows){const nm=(r[ti]||"").trim();if(nm)out.push({name:nm,note:(r[ni]||"").trim(),url:(r[ui]||"").trim()})}}
  else{const j=JSON.parse(text);
    if(Array.isArray(j))return {owner:"",items:j};
    if(j&&j.app==="foodpocket")return {owner:String(j.owner||"").trim(),items:Array.isArray(j.items)?j.items:[]};
    for(const f of j.features||[]){const p=f.properties||{},loc=p.location||{},g=(f.geometry||{}).coordinates||[];
      const nm=loc.name||p.Title||p.name||"";if(!nm)continue;const o={name:nm,url:p.google_maps_url||p["Google Maps URL"]||"",note:loc.address||""};
      if(g.length===2&&(g[0]||g[1])){o.lng=+g[0];o.lat=+g[1]}out.push(o)}}
  return {owner:"",items:out};
}
function mkItem(raw,id,owner){
  const it={id,owner:owner||"",srcId:owner?String(raw.id||""):"",name:String(raw.name||"").trim(),status:raw.status==="been"?"been":"want",country:raw.country||"台灣",county:raw.county||"",district:raw.district||"",type:raw.type||"",rating:raw.r10?(+raw.rating||0):Math.min(10,(+raw.rating||0)*2),r10:true,price:+raw.price||0,pros:raw.pros||"",cons:raw.cons||"",note:raw.note||"",address:raw.address||"",lat:raw.lat!=null?+raw.lat:null,lng:raw.lng!=null?+raw.lng:null,url:raw.url||"",created:+raw.created||Date.now(),updated:+raw.updated||+raw.created||0};
  if(it.lat==null&&it.url){const m=it.url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||it.url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m){it.lat=+m[1];it.lng=+m[2]}}
  if(it.lat!=null&&!it.county&&it.country==="台灣")it.county=nearest(it.lat,it.lng);
  return it;
}
/* 合併規則：不刪除任何資料；新的店新增；兩邊都有的，保留「最後修改時間」較新的那筆 */
async function importItems(pack,silent,mode){
  const list=Array.isArray(pack)?pack:pack.items,fileOwner=Array.isArray(pack)?"":(pack.owner||""),me=getMe();
  let add=0,upd=0,same=0;const byNew={};
  for(const raw of list){
    const nm=String(raw.name||"").trim();if(!nm)continue;
    let eo=String(raw.owner||fileOwner||"").trim();if(mode==="mine"&&(!raw.owner||raw.owner===fileOwner))eo="";if(eo&&me&&eo===me)eo="";
    let id,cur;
    if(!eo){id=/^p[a-z0-9]{6,}$/.test(raw.id||"")?raw.id:null;
      cur=(id&&items.find(x=>x.id===id&&!x.owner))||items.find(x=>!x.owner&&x.name.trim()===nm&&(x.county||"")===(raw.county||x.county||""));}
    else{const src=String(raw.srcId||raw.id||hashS(nm));id="f"+hashS(eo)+"-"+src.replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
      cur=items.find(x=>x.id===id)||items.find(x=>x.owner===eo&&x.name.trim()===nm);}
    if(cur){const it=mkItem(raw,cur.id,eo);
      if((it.updated||0)>(cur.updated||cur.created||0)){it.created=cur.created||it.created;await put(it);upd++}else same++}
    else{const it=mkItem(raw,id||newId(),eo);if(!it.updated)it.updated=it.created;await put(it);add++}
  }
  if(!silent)toast(`新增 ${add} 家、更新 ${upd} 家${same?`、${same} 家已是最新`:""}，原有資料都保留`);
}
const backup=()=>JSON.stringify({app:"foodpocket",v:2,owner:getMe(),exported:Date.now(),items},null,1);
const bkName=()=>`美食口袋-${getMe()||"我"}-${new Date().toISOString().slice(0,10)}.json`;

/* ---------- 共用 ---------- */
function close(){$("ov").classList.remove("on");draft=null}
function toast(msg,act,fn){$("toastMsg").textContent=msg;$("toastAct").textContent=act||"";$("toastAct").hidden=!act;$("toastAct").onclick=()=>{fn&&fn();$("toast").classList.remove("on")};$("toast").classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>$("toast").classList.remove("on"),5000)}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-pin],a");
  if(e.target===$("ov")){close();return}
  if(e.target.closest("#miniSvg")&&draft){const s=$("miniSvg"),pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(s.getScreenCTM().inverse());const [lng,lat]=unP(p.x,p.y);setPos(+lat.toFixed(5),+lng.toFixed(5));return}
  if(mapDragged&&e.target.closest("#bigMap"))return;
  if(!t)return;const ds=t.dataset;
  if(ds.st){fStatus=ds.st;render()}
  else if(ds.who!==undefined&&t.classList.contains("chip")&&!draft){fWho=ds.who;render()}
  else if(ds.mv){mapView=ds.mv;mapVB=VIEWS[ds.mv];selPin=null;render()}
  else if(ds.zm){zoomAt(ds.zm==="in"?1/1.4:1.4);render()}
  else if(ds.pin){selPin=selPin===ds.pin?null:ds.pin;render()}
  else if(ds.open)openDetail(ds.open);
  else if(ds.ss&&draft){draft.status=ds.ss;t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));$("beenBox").hidden=ds.ss!=="been"}
  else if(ds.star&&draft){draft.rating=+ds.star;$("sp").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.star<=draft.rating));$("spv").textContent=draft.rating+" / 10 分"}
  else if(ds.ty&&draft){draft.type=draft.type===ds.ty?"":ds.ty;$("iType").value="";t.parentNode.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ty===draft.type))}
  else if(ds.act){const a=ds.act;
    if(a==="close")close();
    else if(a==="add"){openForm()}
    else if(a==="tools")openTools();
    else if(a==="save"){const d=collect();if(!d.name){$("iName").focus();$("iName").style.borderColor="var(--red)";return}close();await put(d);toast("已儲存")}
    else if(a==="edit")openForm(items.find(x=>x.id===ds.id));
    else if(a==="adopt"){const f=items.find(x=>x.id===ds.id);close();const it={...f,id:newId(),owner:"",srcId:"",status:"want",rating:0,pros:"",cons:"",note:`${f.owner} 推薦`,created:Date.now(),updated:Date.now()};await put(it);toast("已加到你的口袋，朋友的評價會留著");openDetail(it.id)}
    else if(a==="markbeen"){const it=items.find(x=>x.id===ds.id);openForm({...it,status:"been"})}
    else if(a==="del"){const it=items.find(x=>x.id===ds.id);close();lastDeleted=it;await del(it.id);toast(`已刪除「${it.name}」`,"復原",()=>put(lastDeleted))}
    else if(a==="pick")$("fileIn").click();
    else if(a==="paste"){try{const t=await navigator.clipboard.readText();if(t){$("iLink").value=t;onLink()}else hint("剪貼簿是空的")}catch(err){hint("無法讀取剪貼簿，請長按輸入框選「貼上」")}}
    else if(a==="imp-mine"||a==="imp-friend"){const pk=pending;pending=null;close();if(pk)await importItems(pk,false,a==="imp-mine"?"mine":"friend")}
    else if(a==="welcome"){const v=$("iWel").value.trim();if(!v){$("iWel").focus();return}setMe(v);close();toast(`嗨 ${v}，開始收藏吧`)}
    else if(a==="reload"){location.replace(location.pathname+"?v="+Date.now())}
    else if(a==="export"){const fn=bkName();if(!dl){const u=URL.createObjectURL(new Blob([backup()],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}try{await dl.save({filename:fn,data:backup()})}catch(err){toast("沒有下載，可改用「複製備份內容」")}}
    else if(a==="copy"){try{await navigator.clipboard.writeText(backup());toast("已複製，可貼到備忘錄保存")}catch(err){toast("無法複製")}}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="iMe"){setMe(e.target.value.trim());toast("已儲存名字");return}if(e.target.id==="iCountry"&&draft){collect();openForm(draft)}});
$("fileIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;close();
  let pack;try{pack=fromText(f.name,await f.text())}catch(err){toast("這個檔案讀不懂，請選 .json 或 .csv");return}
  const me=getMe();
  if(pack.owner&&pack.owner!==me){pending=pack;
    $("sheet").innerHTML=`<h2>使用者與匯入資料者不同</h2><p>這個檔案是「<b>${esc(pack.owner)}</b>」的資料，你目前是「<b>${esc(me||"未設定名字")}</b>」。要怎麼處理？</p>
    <div class="dl"><div><b>更新我的資料</b>\n當成你自己的備份，同一家店保留較新的那筆，例如在另一台裝置改過名字的情況。</div><div><b>匯入他人資料</b>\n把 ${esc(pack.owner)} 的評分和優缺點加進來。同一家店只會顯示一筆，你會同時看到你的和 ${esc(pack.owner)} 的評價。</div></div>
    <div class="acts"><button class="btn ghost" data-act="imp-mine">更新我的資料</button><button class="btn" data-act="imp-friend">匯入他人資料</button></div><div class="acts"><button class="btn ghost" data-act="close">取消</button></div>`;
    $("ov").classList.add("on");return}
  await importItems(pack,false,"mine")});
let pending=null;
["q","fArea","fType","fSort","fOp","fScore","fMine"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{$("fScore").disabled=!$("fOp").value;render()}));
$("vList").onclick=()=>{view="list";$("vList").setAttribute("aria-pressed",true);$("vMap").setAttribute("aria-pressed",false);render()};
$("vMap").onclick=()=>{view="map";$("vMap").setAttribute("aria-pressed",true);$("vList").setAttribute("aria-pressed",false);render()};
$("addBtn").onclick=()=>openForm();
$("toolsBtn").onclick=openTools;
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
connect();
if(!getMe()){$("sheet").innerHTML=`<h2>歡迎使用美食口袋</h2><p>先取個名字吧。備份檔和分享給朋友的檔案會用這個名字，朋友匯入時才分得出是誰的評價。</p><div class="f"><label for="iWel">你的名字</label><input type="text" id="iWel" maxlength="20" placeholder="例如 Sam" autocomplete="nickname"></div><div class="acts"><button class="btn" data-act="welcome">開始使用</button></div><p class="hint">之後可以在「匯入／備份」裡修改。</p>`;$("ov").classList.add("on")}
(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}})();
}
